services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: springboot-helloworld:latest
    container_name: springboot-helloworld
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx512m -Xms256m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    labels:
      - "app=springboot-helloworld"
      - "version=1.0"

networks:
  app-network:
    driver: bridge
